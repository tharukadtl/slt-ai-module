name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install CmdStan (Prophet's Stan backend)
        run: python -m cmdstanpy.install_cmdstan --verbose

      # The Linux prophet==1.1.5 wheel bundles a stripped-down, runtime-only
      # prophet/stan_model/cmdstan-2.33.1 (no makefile) meant only to run the
      # wheel's own pre-built prophet_model.bin. cmdstanpy>=1.3.0's stricter
      # validate_cmdstan_path() rejects it ("CmdStan installataion missing
      # makefile"), and CmdStanPyBackend.__init__ unconditionally prefers this
      # bundled copy over the properly-installed one above whenever it exists --
      # so every forecast-backed endpoint fails with "AttributeError: 'Prophet'
      # object has no attribute 'stan_backend'" regardless of install order.
      # Removing the broken bundled copy makes it fall through to the real one.
      # Confirmed by direct reproduction (prophet/models.py:CmdStanPyBackend),
      # not assumed -- installing CmdStan before *or* after `pip install` alone
      # did not fix this; only removing the incompatible bundled copy did.
      - name: Remove prophet's incompatible bundled CmdStan runtime
        run: |
          python -c "
          import prophet, pathlib
          bundled = pathlib.Path(prophet.__file__).parent / 'stan_model' / 'cmdstan-2.33.1'
          if bundled.exists():
              import shutil
              shutil.rmtree(bundled)
              print(f'Removed incompatible bundled CmdStan at {bundled}')
          else:
              print('No bundled CmdStan found, nothing to remove')
          "

      # --cov=. (repo root) + --cov-report=xml (coverage.xml, Cobertura format, for
      # summarize_coverage.py below) + --cov-report=html (htmlcov/) on top of the existing
      # -v/--junitxml, which summarize_junit.py below still needs.
      - name: Run tests
        run: python -m pytest tests/ -v --junitxml=report.xml --cov=. --cov-report=xml --cov-report=html

      # if: always() so a summary appears even when tests fail. python3 is
      # already set up above.
      - name: Test summary
        if: always()
        run: python .github/scripts/summarize_junit.py "report.xml"

      # Separate section from the pass/fail Test summary above -- coverage.xml is written
      # regardless of individual test outcomes (only a config/collection error would prevent it).
      - name: Coverage summary
        if: always()
        run: python .github/scripts/summarize_coverage.py "coverage.xml"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30
          if-no-files-found: ignore

  # Builds the exact image that deploy.yml pulls onto the VM -- CI builds and pushes it here so
  # the production container is byte-for-byte what the test job above just tested, never rebuilt
  # from source on the VM. Gated the same way notify-deploy already is (only master, only on a
  # green test job) since a broken/PR build has no business landing in the registry.
  build-and-push:
    needs: test
    if: success() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push slt-ai-module image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tharukadtl/slt-ai-module:${{ github.sha }}
            ghcr.io/tharukadtl/slt-ai-module:latest

  # Fires only for a real push to master with a green test job -- never for a PR run or a
  # push to any other branch, matching the same "only master, only on success" convention
  # fieldops/deploy.yml's own workflow_run trigger already enforces via its `branches: [master]`
  # filter + `if: conclusion == 'success'` check. Uses a PAT (CROSS_REPO_DISPATCH_TOKEN), not the
  # default GITHUB_TOKEN, because GITHUB_TOKEN cannot trigger a repository_dispatch (or anything
  # else) in a different repository -- confirmed via GitHub's own docs on GITHUB_TOKEN's scope
  # being limited to the repo the workflow runs in.
  notify-deploy:
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Notify fieldops (slt-backend) of a successful Test run
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tharukadtl/slt-backend/dispatches \
            -d '{"event_type":"external-test-passed","client_payload":{"source_repo":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
